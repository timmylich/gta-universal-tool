# Draft recipe for https://gitlab.com/fdroid/fdroiddata (metadata/io.github.timmylich.gtatool.yml).
# The android/ project is generated by `expo prebuild`, so it is created in `init` before Gradle runs.
Categories:
  - Development
  - Games
License: AGPL-3.0-or-later
AuthorName: timmylich
WebSite: https://github.com/timmylich/gta-universal-tool
SourceCode: https://github.com/timmylich/gta-universal-tool
IssueTracker: https://github.com/timmylich/gta-universal-tool/issues
Changelog: https://github.com/timmylich/gta-universal-tool/blob/HEAD/CHANGELOG.md
Donate: https://web.tribute.tg/d/RVs

AutoName: GTA Universal Tool

RepoType: git
Repo: https://github.com/timmylich/gta-universal-tool.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz
      - tar xJf node.tar.xz --strip-components=1 -C /usr/local
      - update-java-alternatives -a
    init:
      - cd ..
      - npm ci
      - npx expo prebuild --platform android --no-install
    subdir: android/app
    gradle:
      - yes
    scanignore:
      - node_modules/react-native/sdks/hermesc
    prebuild: sed -i -e 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' ../gradle.properties

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
