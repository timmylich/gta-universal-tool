name: Pages

# Publishes site/ to GitHub Pages; images come from the store metadata, so they stay in one place.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', 'fastlane/metadata/android/ru-RU/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy images
        run: |
          mkdir -p site/img
          cp fastlane/metadata/android/en-US/images/icon.png fastlane/metadata/android/en-US/images/featureGraphic.png site/img/
          cp fastlane/metadata/android/ru-RU/images/phoneScreenshots/*.png site/img/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
