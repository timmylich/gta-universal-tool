name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gta-universal-tool-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

  core:
    name: Format self-test
    runs-on: ubuntu-latest
    env:
      KOTLIN: 2.1.21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install kotlinc
        run: |
          curl -sSfL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN/kotlin-compiler-$KOTLIN.zip"
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - run: sh scripts/test-core.sh
