name: Release

# Push a tag like v0.2.0 to build, sign and publish a GitHub release.
# Signing secrets: KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the tag matches versionName
        run: |
          APP=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$APP" != "${GITHUB_REF_NAME#v}" ]; then echo "versionName $APP != tag $GITHUB_REF_NAME"; exit 1; fi
      - run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are not set"; exit 1; fi
          out="GTA-Universal-Tool-${GITHUB_REF_NAME}.apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          "$bt/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$bt/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$out" aligned.apk
          rm release.jks aligned.apk
          sha256sum "$out" > "$out.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GTA-Universal-Tool-*.apk
            GTA-Universal-Tool-*.apk.sha256
          generate_release_notes: true
