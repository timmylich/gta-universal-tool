name: Bug report / Ошибка
description: Something does not work / Что-то работает не так
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened / Что случилось
      description: Steps, what you expected and what you got / Шаги, что ожидали и что получили
    validations:
      required: true
  - type: input
    attributes:
      label: App version / Версия приложения
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Device and Android version / Устройство и версия Android
  - type: input
    attributes:
      label: Game / client / Игра или клиент
      placeholder: GTA SA 2.10, SA-MP client …
  - type: textarea
    attributes:
      label: Files / Файлы
      description: Mod files that reproduce the problem (no original game files, please) / Файлы мода для воспроизведения (без файлов самой игры)
